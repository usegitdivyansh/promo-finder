[server]
# screenplay uploads are small; keep the limit low
maxUploadSize = 30

[browser]
gatherUsageStats = false

[client]
# hide the streamlit main menu and deploy controls for viewers
toolbarMode = "minimal"
showErrorDetails = false

# palette from the design brief: warm dark background, cream text, amber for actions and live status only,
# deep red for warnings and errors only. mirror any change in ui/style.css (the --c-* variables).
# fonts: Inter (body), Oswald (headings), JetBrains Mono (timestamps). no kuku logo, wordmark or icons anywhere.
[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Oswald:https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 16
baseRadius = "large"
primaryColor = "#D98E3A"
backgroundColor = "#14110F"
secondaryBackgroundColor = "#211D1A"
textColor = "#F2E9DD"
borderColor = "#3A332E"
linkColor = "#D98E3A"
redColor = "#A5362B"
orangeColor = "#D98E3A"
yellowColor = "#D98E3A"
greenColor = "#7FA36B"
blueColor = "#9C9389"
