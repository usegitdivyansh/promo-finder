[server]
# screenplay uploads are small; keep the limit low
maxUploadSize = 30

[browser]
gatherUsageStats = false

[client]
# hide the streamlit main menu and deploy controls for viewers
toolbarMode = "minimal"
showErrorDetails = false

# colours from kukufm.com (checked 2026-11-05): theme-color meta #E25506 (the one accent), dark surface #0A0A14,
# logo red #EC1C24, badge gold #FFBB10, green #01860A (lifted to #3FCB5A for contrast on dark); font Figtree.
# colours only: no kuku logo, wordmark or icons are used anywhere. dark theme only.
[theme]
base = "dark"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
baseRadius = "large"
primaryColor = "#E25506"
backgroundColor = "#0A0A14"
secondaryBackgroundColor = "#14141F"
textColor = "#ECEBE6"
borderColor = "#26263A"
redColor = "#EC1C24"
orangeColor = "#E25506"
yellowColor = "#FFBB10"
greenColor = "#3FCB5A"
