llm:
  # swap models here only: each model is named once below; everything else refers to "fast" or "strong".
  # litellm names: provider/model. A full litellm name also works anywhere a slot name is used.
  models:
    fast: "gemini/gemini-3.5-flash-lite"               # free tier; step 2 summaries on non-confidential input
    strong: "openrouter/deepseek/deepseek-v4.1-flash"  # paid; everything else, the fallback, and all confidential runs
  provider_model: "fast"                               # default for any step not listed in step_models
  step_models:                                         # per prompt; empty = provider_model
    episode: "fast"
    bible: "strong"
    bible_merge: "strong"
    shots: "strong"
    scripts: "strong"
    match: "strong"
    judge_full: "strong"
    judge_fresh: "strong"
  judge_model: ""                                      # used for judges only when step_models has no entry
  fallback_model: "strong"   # when a free model hits its daily quota or keeps returning 429
  # confidential mode: every step uses this paid model, no free-tier model and no fallback.
  # on automatically for any input under data/ (kuku's pack); also --confidential
  confidential_model: "strong"
  confidential: false
  prices:                                              # usd per 1m tokens [input, output], checked on openrouter.ai/api/v1/models 2026-11-05
    "gemini/gemini-3.5-flash-lite": [0, 0]             # free tier
    "gemini/gemini-3.6-flash": [0, 0]                  # free tier (20 requests/day)
    "openrouter/deepseek/deepseek-v4.1-flash": [0.045, 0.50]
  budget_usd: 2.0                                      # hard stop for paid spend, all runs (ledger: cache/_spend.jsonl)
  unknown_price: [5.0, 15.0]                           # $ per 1M in/out for a model in neither llm.prices nor litellm's table
  temperature: 0
  reasoning_effort: "low"                              # keep thinking tokens small; dropped for models that don't support it
  max_retries: 3                                       # retries on invalid json / failed code checks
  rate_retries: 3                                      # 429 backoffs before falling back for that call
  rpm_limit: 8                                         # default throttle per model
  rpm_limits:
    "gemini/gemini-3.5-flash-lite": 8                  # free tier
    "openrouter/deepseek/deepseek-v4.1-flash": 40      # paid, no free-tier cap
  max_tokens: 16384
  # the bible holds every character, thread and event id; on 50 episodes its output (with reasoning) passes 16k
  max_tokens_by_prompt:
    bible: 32768
    bible_merge: 65536
    scripts: 49152
    match: 32768
  timeout_sec: 240
  mock: false                                          # true = read responses from tests/fixtures/mock_responses, no api calls
promo:
  num_promos_min: 12
  num_promos_max: 18
  per_template_max: 3
  min_sec: 20
  max_sec: 60
  target_min_sec: 30
  target_max_sec: 45
  hook_window_sec: 3
shots:
  long: [25, 45]
  medium: [10, 20]
  small: [3, 8]
  max_long: 1
  max_medium: 2
  max_small: 3
  min_intensity: 6
  extend_min_intensity: 5
  quote_match: 0.85
scripts:
  # 2 promos per thread means 12+ promos need hooks from 6+ threads; more scripts give the selector room
  num_scripts: 28
bible:
  chunk_size: 10            # episodes per partial bible when input is too long
  max_input_chars: 60000    # above this, build partial bibles then merge
judge:
  fresh: true              # tier 2 fresh-viewer judge; false = clarity from judge_full
  batch_size: 5
  seed: 7
select:
  max_per_thread: 2
  # promos scoring below this are dropped, never used to reach num_promos_min
  min_total: 60
  min_score_for_category: 60
safety_net:
  num_shots: 15
baseline:
  last_sec: 30
parse:
  words_per_sec: 2.5
  min_line_sec: 2
  recap_window_sec: 15
  recap_similarity: 0.9
  recap_lookback_sec: 30

# each episode's closing beat as a cliffhanger shot (cliffhanger line plus reaction, inside its scene)
ending:
  enabled: false
  min_sec: 10
  max_sec: 18
  tail_sec: 4
  default_intensity: 7

# code-built promos: a strong earlier hook (same thread or character) cut into an episode ending
hook_ending:
  enabled: false
  window_episodes: 8
  min_hook_intensity: 8
  max_candidates: 30

# single-scene promos that end on each episode's cliffhanger and start where a strong line lands within the hook window
ending_scene:
  enabled: true
  min_sec: 20
  max_sec: 45
  hook_min_intensity: 8
