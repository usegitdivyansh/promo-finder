llm:
  # swap models here only. litellm names: provider/model
  provider_model: "gemini/gemini-3.6-flash"            # stable flash, free tier (limits: aistudio.google.com/rate-limit)
  judge_model: ""                                      # empty = same as provider_model
  fallback_model: "openrouter/deepseek/deepseek-v4.1-flash"   # used when gemini hits a daily quota or keeps returning 429
  prices:                                              # usd per 1m tokens [input, output], checked on openrouter.ai/api/v1/models 2026-11-05
    "gemini/gemini-3.6-flash": [0, 0]                  # free tier
    "openrouter/deepseek/deepseek-v4.1-flash": [0.045, 0.50]
  budget_usd: 2.0                                      # hard stop for paid spend, all runs (ledger: cache/_spend.jsonl)
  temperature: 0
  reasoning_effort: "low"                              # keep thinking tokens small; dropped for models that don't support it
  max_retries: 3                                       # retries on invalid json / failed code checks
  rate_retries: 3                                      # 429 backoffs before falling back for that call
  rpm_limit: 8                                         # throttle; free-tier rpm is per project, check ai studio
  max_tokens: 16384
  timeout_sec: 240
  mock: false                                          # true = read responses from tests/fixtures/mock_responses, no api calls
promo:
  num_promos_min: 12
  num_promos_max: 18
  per_template_max: 3
  min_sec: 20
  max_sec: 60
  target_min_sec: 30
  target_max_sec: 45
  hook_window_sec: 3
shots:
  long: [25, 45]
  medium: [10, 20]
  small: [3, 8]
  max_long: 1
  max_medium: 2
  max_small: 3
  min_intensity: 6
  extend_min_intensity: 5
  quote_match: 0.85
scripts:
  num_scripts: 20
bible:
  chunk_size: 10            # episodes per partial bible when input is too long
  max_input_chars: 60000    # above this, build partial bibles then merge
judge:
  fresh: true              # tier 2 fresh-viewer judge; false = clarity from judge_full
  batch_size: 5
  seed: 7
select:
  max_per_thread: 2
  min_score_for_category: 60
safety_net:
  num_shots: 15
baseline:
  last_sec: 30
parse:
  words_per_sec: 2.5
  min_line_sec: 2
  recap_window_sec: 15
  recap_similarity: 0.9
  recap_lookback_sec: 30
